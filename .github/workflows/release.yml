name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # With changesets waiting, this opens or updates the version pull request, and the jobs below
  # skip. With none waiting, the versions on main are the ones to ship.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Open or update the version pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          title: 'chore(release): version the VS Code extension and @swirls/deploy'
          commit: 'chore(release): version the VS Code extension and @swirls/deploy'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Skips when vscode-v<version> is already tagged.
  extension:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Publish the VS Code extension
        run: bun run release:extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Its own job so the npm environment's protection rules never hold up the extension. Publishes
  # by trusted publishing (OIDC, no token) and skips a version npm already has.
  npm:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use npm with trusted publishing support
        run: npm install --global npm@latest
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Publish @swirls/deploy
        run: bun run release:deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
